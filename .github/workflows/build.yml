name: Compilar APK para Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar código
      uses: actions/checkout@v4

    - name: Compilar APK con Kivy Action
      uses: kivy/build-action@v1
      with:
        filename: main.py
        mode: debug

    - name: Subir APK generado
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk